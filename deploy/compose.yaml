# Runs the app on the Oracle Cloud VM. The deploy workflow copies this file and
# the Caddyfile to /opt/mail and sets IMAGE_TAG in /opt/mail/.env.
# The app secrets are in /opt/mail/app.env (mode 600). See deploy/README.md.
# Two app containers run the same image. The deploy replaces one at a time, and
# Caddy sends requests to the other one, so a deploy does not stop the site.
# The jobs take a lease in the database, so two containers do not run a job twice.
x-app: &app
  image: ghcr.io/sam-ayo/mail:${IMAGE_TAG:?Set IMAGE_TAG in /opt/mail/.env}
  restart: unless-stopped
  # Node as PID 1 does not stop on SIGTERM. The init process passes the signal.
  init: true
  # The app writes no files and needs no Linux capabilities. Code that runs
  # through a bug in the app cannot change the image or get new privileges.
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  env_file: app.env
  environment:
    APP_URL: https://mail.samayo.me
    PORT: "3000"
    HOST: 0.0.0.0
    # This server runs the mail check each minute and the daily cache job. See app/server/jobs.server.ts.
    RUN_JOBS: "1"
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/welcome"]
    interval: 30s
    timeout: 5s
    start_period: 20s
    # Check each second at the start, so the deploy sees a healthy container soon.
    start_interval: 1s
  # On SIGTERM, the server finishes its open requests. Give streamed responses time.
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "5" }

services:
  app-a: *app
  app-b: *app

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app-a, app-b]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The TLS certificates. Keep this volume, or Caddy asks Let's Encrypt for new ones.
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
