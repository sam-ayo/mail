name: Migrations

# Runs only when a migration or the migration runner changes. Run it by hand
# (workflow_dispatch) on main to apply migrations again after a failed run.
on:
  push:
    branches: [main]
    paths: &paths
      - migrations/**
      - scripts/migrate.sh
      - .github/workflows/migrations.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  # Applies all the migrations to an empty database with the Postgres version of production.
  # A migration that fails then fails the pull request, not production.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - run: scripts/migrate.sh
      - name: Run the migrations again (they must not run twice)
        run: scripts/migrate.sh | tee /dev/stderr | grep -qx "Done. 0 file(s) recorded."

  # Vercel deploys main from GitHub by itself. Write migrations that the code
  # in production now can still use, because the new code can go live first.
  migrate:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: migrate-production
    steps:
      - uses: actions/checkout@v7
      # MIGRATIONS_DATABASE_URL uses the Supabase session pooler (port 5432). The direct
      # database host has only an IPv6 address, and GitHub runners have only IPv4.
      - name: Apply the migrations to production
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: scripts/migrate.sh
