name: Deploy

# Builds the app image for the Oracle Cloud VM (ARM), and deploys it from main.
# A pull request only builds the image, to check the Dockerfile.
# The deploy needs the repository variable DEPLOY_HOST and the secrets
# DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS. Without DEPLOY_HOST, it skips the deploy.
on:
  push:
    branches: [main]
    paths: &paths
      - "**"
      - "!worker/**"
      - "!migrations/**"
      - "!docs/**"
      - "!directory/**"
      - "!.agents/**"
      - "!**/*.md"
      - "!.github/**"
      - .github/workflows/deploy.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

# A new push to a branch cancels the run for an older push, also in the
# middle of a deploy. Then the new run builds and deploys the latest commit.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sam-ayo/mail

jobs:
  build:
    # The VM has an ARM CPU. GitHub gives ARM machines to public repositories for free.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      HOST: ubuntu@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up SSH
        # The secrets go in through env, not into the script text.
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Copy the Compose file and the Caddyfile
        run: scp deploy/compose.yaml deploy/Caddyfile "$HOST:/opt/mail/"
      - name: Start the new image, one app container at a time
        # The job token pulls the image. It ends with the job, so no registry token stays on the VM.
        # The script replaces app-a, waits until it is healthy, and then does the same for app-b.
        # Caddy sends requests to the other container meanwhile, so the site does not stop.
        # A failed pull still removes the registry login, because of the trap.
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh "$HOST" docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          ssh "$HOST" "set -e
            trap 'docker logout ghcr.io > /dev/null' EXIT
            cd /opt/mail
            echo IMAGE_TAG=$IMAGE_TAG > .env
            docker compose pull --quiet app-a app-b
            docker logout ghcr.io
            for service in app-a app-b; do
              docker compose up -d --no-deps \$service
              for i in \$(seq 1 60); do
                status=\$(docker inspect -f '{{.State.Health.Status}}' \$(docker compose ps -q \$service))
                [ \"\$status\" = healthy ] && break
                [ \$i = 60 ] && { echo \"\$service is \$status\"; docker compose logs --tail 50 \$service; exit 1; }
                sleep 2
              done
              echo \"\$service: healthy\"
            done
            # Load a changed Caddyfile before Compose removes containers that Caddy can still use.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker compose up -d --remove-orphans
            docker image prune -f > /dev/null"
