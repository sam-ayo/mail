name: Secret expiry

# Opens an issue 30 days before a secret in .github/secret-expiry.json expires.
# Add each secret that has an expiry date to that file.
on:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths: [.github/secret-expiry.json]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          WARN_DAYS: 30
        run: |
          today=$(date -u +%s)
          jq -c '.[]' .github/secret-expiry.json | while read -r secret; do
            name=$(jq -r .name <<<"$secret")
            expires=$(jq -r .expires <<<"$secret")
            days=$(( ($(date -u -d "$expires" +%s) - today) / 86400 ))
            echo "$name: expires $expires ($days days)"
            (( days <= WARN_DAYS )) || continue

            title="Secret expiry: $name"
            if [[ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number' </dev/null)" ]]; then
              echo "An open issue already exists."
              continue
            fi
            if (( days < 0 )); then when="expired on $expires"; else when="expires on $expires ($days days)"; fi
            gh issue create --title "$title" --body "The $name $when.

          $(jq -r .renew <<<"$secret")" </dev/null
            echo "::warning::$name $when"
          done
