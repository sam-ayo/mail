name: Worker

# Checks the Worker in worker/. It does not deploy the Worker: the Worker has no
# schedule and no CRON_SECRET, because the app on the VM runs the jobs. To start
# the Worker again, set the secret and the schedule, then run "cf deploy" in worker/
# (see worker/cloudflare.config.ts).
on:
  push:
    branches: [main]
    paths: &paths
      - worker/**
      - .github/workflows/worker.yml
  pull_request:
    paths: *paths

env:
  CLOUDFLARE_ACCOUNT_ID: d6741b284ff6ec0caa6d15919dc00294

jobs:
  # The Worker has its own package.json and lockfile.
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
