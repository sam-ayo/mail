name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEON_PROJECT_ID: morning-pond-76593373
  CLOUDFLARE_ACCOUNT_ID: d6741b284ff6ec0caa6d15919dc00294

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  # The Worker in worker/ has its own package.json and lockfile.
  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  # Applies the new migrations to a copy of the production database.
  # A migration that fails on the real schema or data then fails the pull request, not production.
  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: expiry
        run: echo "at=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ci/pr-${{ github.event.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          database: mail
          role: mail_owner
          # Neon deletes the branch at this time if the delete step below does not run.
          expires_at: ${{ steps.expiry.outputs.at }}
      - run: scripts/migrate.sh
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
      - name: Run the migrations again (they must not run twice)
        run: scripts/migrate.sh | tee /dev/stderr | grep -qx "Done. 0 file(s) recorded."
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
      - if: always() && steps.branch.outputs.branch_id
        uses: neondatabase/delete-branch-action@v3
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch_id }}

  # Vercel deploys main from GitHub by itself. Write migrations that the code
  # in production now can still use, because the new code can go live first.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    concurrency: migrate-production
    steps:
      - uses: actions/checkout@v7
      - name: Apply the migrations to production
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          DATABASE_URL="$(npx -y neonctl@8 connection-string main \
            --project-id "$NEON_PROJECT_ID" --database-name mail --role-name mail_owner)"
          echo "::add-mask::$DATABASE_URL"
          DATABASE_URL="$DATABASE_URL" scripts/migrate.sh

  deploy-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: worker
    runs-on: ubuntu-24.04
    concurrency: deploy-worker
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The CRON_SECRET secret stays on the Worker. Change it with: cf workers secrets update
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
