name: CI

# Checks the app. A change to only the Worker, the migrations, the docs, or
# other workflows skips this workflow. Those files have their own workflows.
on:
  push:
    branches: [main]
    paths: &paths
      - "**"
      - "!worker/**"
      - "!migrations/**"
      - "!docs/**"
      - "!directory/**"
      - "!.agents/**"
      - "!**/*.md"
      - "!.github/**"
      - .github/workflows/ci.yml
  pull_request:
    paths: *paths

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # mcp-use loads the built MCP server to check it, and env.server.ts
      # needs these values when it loads. The build connects to nothing.
      - run: pnpm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost/build
          SESSION_SECRET: build
          ENCRYPTION_KEY: build
