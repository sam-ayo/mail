# Fly.io config. Deploy with: fly deploy
# Secrets (DATABASE_URL, SESSION_SECRET, ENCRYPTION_KEY, and the others in
# .env.example): fly secrets set NAME=value
app = "relay-mail"
# Near the Neon database in AWS us-east-1.
primary_region = "iad"

[env]
  APP_URL = "https://mail.samayo.me"
  PORT = "3000"
  # This server runs the mail check each minute and the daily cache job. See app/server/jobs.server.ts.
  RUN_JOBS = "1"

[http_service]
  internal_port = 3000
  force_https = true
  # The jobs run in the server, so a machine must always run.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/welcome"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
